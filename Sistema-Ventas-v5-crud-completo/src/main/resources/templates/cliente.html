<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-header"><i class="fas fa-store"></i> Sistema Ventas</div>
    <nav><ul>
        <li><a th:href="@{/home}"><i class="fas fa-chart-line"></i> Inicio</a></li>
        <li><a th:href="@{/ventas}"><i class="fas fa-shopping-cart"></i> Ventas</a></li>
        <li><a th:href="@{/productos}"><i class="fas fa-box"></i> Productos</a></li>
        <li><a class="active" th:href="@{/cliente}"><i class="fas fa-users"></i> Clientes</a></li>
        <li><a th:href="@{/usuarios}"><i class="fas fa-user-shield"></i> Usuarios</a></li>
        <li><a th:href="@{/detalleventa}"><i class="fas fa-list-alt"></i> Detalle Venta</a></li>
        <li><a th:href="@{/cerrarsesion}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
    </ul></nav>
</aside>

<div class="container">
    <div class="topbar"><h2><i class="fas fa-users"></i> CRUD de Clientes</h2></div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="grid">
        <div class="card">
            <h3 th:text="${editando} ? 'Actualizar cliente' : 'Crear cliente'"></h3>
            <form th:action="@{/cliente/guardar}" method="post">
                <div class="form-grid">
                    <input type="number" name="dpiCliente" placeholder="DPI" th:value="${clienteForm.dpiCliente}" required>
                    <input type="text" name="nombreCliente" placeholder="Nombre" th:value="${clienteForm.nombreCliente}" required>
                    <input type="text" name="apellidoCliente" placeholder="Apellido" th:value="${clienteForm.apellidoCliente}" required>
                    <input type="text" name="direccionCliente" placeholder="Dirección" th:value="${clienteForm.direccionCliente}" required>
                    <select name="estadoCliente" required>
                        <option value="1" th:selected="${clienteForm.estadoCliente == 1}">Activo</option>
                        <option value="0" th:selected="${clienteForm.estadoCliente == 0}">Inactivo</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/cliente}"><i class="fas fa-eraser"></i> Limpiar</a>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Buscar cliente</h3>
            <form th:action="@{/cliente}" method="get">
                <div class="form-grid">
                    <input type="number" name="buscar" placeholder="Buscar por DPI" th:value="${buscar}">
                </div>
                <div class="search-actions">
                    <button class="btn btn-success" type="submit"><i class="fas fa-search"></i> Buscar</button>
                    <a class="btn btn-secondary" th:href="@{/cliente}"><i class="fas fa-rotate-left"></i> Mostrar todos</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-card">
        <div class="table-header">
            <strong>Listado de clientes</strong>
            <span th:text="'Registros: ' + ${#lists.size(clientes)}"></span>
        </div>
        <table>
            <thead>
            <tr>
                <th>DPI</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.dpiCliente}"></td>
                <td th:text="${cliente.nombreCliente}"></td>
                <td th:text="${cliente.apellidoCliente}"></td>
                <td th:text="${cliente.direccionCliente}"></td>
                <td>
                    <span class="estado" th:classappend="${cliente.estadoCliente == 1} ? ' activo' : ' inactivo'"
                          th:text="${cliente.estadoCliente == 1} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td>
                    <div class="row-actions">
                        <a class="btn btn-warning" th:href="@{/cliente(editar=${cliente.dpiCliente})}"><i class="fas fa-edit"></i> Actualizar</a>
                        <form class="inline-form" th:action="@{/cliente/eliminar/{dpi}(dpi=${cliente.dpiCliente})}" method="post">
                            <button class="btn btn-danger" type="submit" onclick="return confirm('¿Eliminar este cliente?')"><i class="fas fa-trash"></i> Borrar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6" class="empty">No hay clientes registrados</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
