<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Venta</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-header"><i class="fas fa-store"></i> Sistema Ventas</div>
    <nav><ul>
        <li><a th:href="@{/home}"><i class="fas fa-chart-line"></i> Inicio</a></li>
        <li><a th:href="@{/ventas}"><i class="fas fa-shopping-cart"></i> Ventas</a></li>
        <li><a th:href="@{/productos}"><i class="fas fa-box"></i> Productos</a></li>
        <li><a th:href="@{/cliente}"><i class="fas fa-users"></i> Clientes</a></li>
        <li><a th:href="@{/usuarios}"><i class="fas fa-user-shield"></i> Usuarios</a></li>
        <li><a class="active" th:href="@{/detalleventa}"><i class="fas fa-list-alt"></i> Detalle Venta</a></li>
        <li><a th:href="@{/cerrarsesion}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
    </ul></nav>
</aside>

<div class="container">
    <div class="topbar"><h2><i class="fas fa-list-alt"></i> CRUD de Detalle de Venta</h2></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="grid">
        <div class="card">
            <h3 th:text="${editando} ? 'Actualizar detalle' : 'Crear detalle'"></h3>
            <form th:action="@{/detalleventa/guardar}" method="post">
                <div class="form-grid">
                    <input type="number" name="codigoDetalleVenta" placeholder="Código detalle" th:value="${detalleForm.codigoDetalleVenta}" required>
                    <input type="number" min="1" name="cantidad" placeholder="Cantidad" th:value="${detalleForm.cantidad}" required>
                    <input type="number" step="0.01" min="0" name="precioUnitario" placeholder="Precio unitario" th:value="${detalleForm.precioUnitario}" required>
                    <input type="number" step="0.01" placeholder="Subtotal automático" th:value="${detalleForm.subtotal}" readonly>
                    <select name="productoId" required>
                        <option value="">Seleccione producto</option>
                        <option th:each="producto : ${productos}" th:value="${producto.codigoProducto}"
                                th:selected="${detalleForm.producto != null and detalleForm.producto.codigoProducto == producto.codigoProducto}"
                                th:text="${producto.nombreProducto}"></option>
                    </select>
                    <select name="ventaId" required>
                        <option value="">Seleccione venta</option>
                        <option th:each="venta : ${ventas}" th:value="${venta.codigoVenta}"
                                th:selected="${detalleForm.venta != null and detalleForm.venta.codigoVenta == venta.codigoVenta}"
                                th:text="${'Venta ' + venta.codigoVenta}"></option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/detalleventa}"><i class="fas fa-eraser"></i> Limpiar</a>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Buscar detalle</h3>
            <form th:action="@{/detalleventa}" method="get">
                <div class="form-grid">
                    <input type="number" name="buscar" placeholder="Buscar por código" th:value="${buscar}">
                </div>
                <div class="search-actions">
                    <button class="btn btn-success" type="submit"><i class="fas fa-search"></i> Buscar</button>
                    <a class="btn btn-secondary" th:href="@{/detalleventa}"><i class="fas fa-rotate-left"></i> Mostrar todos</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-card">
        <div class="table-header"><strong>Listado de detalles</strong><span th:text="'Registros: ' + ${#lists.size(detalles)}"></span></div>
        <table>
            <thead>
            <tr><th>Código</th><th>Cantidad</th><th>Precio Unitario</th><th>Subtotal</th><th>Producto</th><th>Venta</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="detalle : ${detalles}">
                <td th:text="${detalle.codigoDetalleVenta}"></td>
                <td th:text="${detalle.cantidad}"></td>
                <td th:text="'Q ' + ${detalle.precioUnitario}"></td>
                <td th:text="'Q ' + ${detalle.subtotal}"></td>
                <td th:text="${detalle.producto != null ? detalle.producto.nombreProducto : 'N/A'}"></td>
                <td th:text="${detalle.venta != null ? detalle.venta.codigoVenta : 'N/A'}"></td>
                <td>
                    <div class="row-actions">
                        <a class="btn btn-warning" th:href="@{/detalleventa(editar=${detalle.codigoDetalleVenta})}"><i class="fas fa-edit"></i> Actualizar</a>
                        <form class="inline-form" th:action="@{/detalleventa/eliminar/{id}(id=${detalle.codigoDetalleVenta})}" method="post">
                            <button class="btn btn-danger" type="submit" onclick="return confirm('¿Eliminar este detalle?')"><i class="fas fa-trash"></i> Borrar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(detalles)}"><td colspan="7" class="empty">No hay detalles registrados</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
