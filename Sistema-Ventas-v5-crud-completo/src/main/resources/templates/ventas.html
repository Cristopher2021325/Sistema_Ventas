<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-header"><i class="fas fa-store"></i> Sistema Ventas</div>
    <nav><ul>
        <li><a th:href="@{/home}"><i class="fas fa-chart-line"></i> Inicio</a></li>
        <li><a class="active" th:href="@{/ventas}"><i class="fas fa-shopping-cart"></i> Ventas</a></li>
        <li><a th:href="@{/productos}"><i class="fas fa-box"></i> Productos</a></li>
        <li><a th:href="@{/cliente}"><i class="fas fa-users"></i> Clientes</a></li>
        <li><a th:href="@{/usuarios}"><i class="fas fa-user-shield"></i> Usuarios</a></li>
        <li><a th:href="@{/detalleventa}"><i class="fas fa-list-alt"></i> Detalle Venta</a></li>
        <li><a th:href="@{/cerrarsesion}"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
    </ul></nav>
</aside>

<div class="container">
    <div class="topbar"><h2><i class="fas fa-shopping-cart"></i> CRUD de Ventas</h2></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="grid">
        <div class="card">
            <h3 th:text="${editando} ? 'Actualizar venta' : 'Crear venta'"></h3>
            <form th:action="@{/ventas/guardar}" method="post">
                <div class="form-grid">
                    <input type="number" name="codigoVenta" placeholder="Código" th:value="${ventaForm.codigoVenta}" required>
                    <input type="date" name="fechaVenta" th:value="${#dates.format(ventaForm.fechaVenta, 'yyyy-MM-dd')}" required>
                    <input type="number" step="0.01" min="0" name="total" placeholder="Total" th:value="${ventaForm.total}" required>
                    <select name="estado" required>
                        <option value="1" th:selected="${ventaForm.estado == 1}">Activa</option>
                        <option value="0" th:selected="${ventaForm.estado == 0}">Inactiva</option>
                    </select>
                    <select name="clienteId" required>
                        <option value="">Seleccione cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.dpiCliente}"
                                th:selected="${ventaForm.cliente != null and ventaForm.cliente.dpiCliente == cliente.dpiCliente}"
                                th:text="${cliente.nombreCliente + ' ' + cliente.apellidoCliente}"></option>
                    </select>
                    <select name="usuarioId" required>
                        <option value="">Seleccione usuario</option>
                        <option th:each="usuario : ${usuarios}" th:value="${usuario.codigoUsuario}"
                                th:selected="${ventaForm.usuario != null and ventaForm.usuario.codigoUsuario == usuario.codigoUsuario}"
                                th:text="${usuario.username}"></option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/ventas}"><i class="fas fa-eraser"></i> Limpiar</a>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Buscar venta</h3>
            <form th:action="@{/ventas}" method="get">
                <div class="form-grid">
                    <input type="number" name="buscar" placeholder="Buscar por código" th:value="${buscar}">
                </div>
                <div class="search-actions">
                    <button class="btn btn-success" type="submit"><i class="fas fa-search"></i> Buscar</button>
                    <a class="btn btn-secondary" th:href="@{/ventas}"><i class="fas fa-rotate-left"></i> Mostrar todas</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-card">
        <div class="table-header"><strong>Listado de ventas</strong><span th:text="'Registros: ' + ${#lists.size(ventas)}"></span></div>
        <table>
            <thead>
            <tr><th>Código</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Cliente</th><th>Usuario</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="venta : ${ventas}">
                <td th:text="${venta.codigoVenta}"></td>
                <td th:text="${#dates.format(venta.fechaVenta, 'yyyy-MM-dd')}"></td>
                <td th:text="'Q ' + ${venta.total}"></td>
                <td><span class="estado" th:classappend="${venta.estado == 1} ? ' activo' : ' inactivo'" th:text="${venta.estado == 1} ? 'Activa' : 'Inactiva'"></span></td>
                <td th:text="${venta.cliente != null ? venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente : 'N/A'}"></td>
                <td th:text="${venta.usuario != null ? venta.usuario.username : 'N/A'}"></td>
                <td>
                    <div class="row-actions">
                        <a class="btn btn-warning" th:href="@{/ventas(editar=${venta.codigoVenta})}"><i class="fas fa-edit"></i> Actualizar</a>
                        <form class="inline-form" th:action="@{/ventas/eliminar/{id}(id=${venta.codigoVenta})}" method="post">
                            <button class="btn btn-danger" type="submit" onclick="return confirm('¿Eliminar esta venta?')"><i class="fas fa-trash"></i> Borrar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(ventas)}"><td colspan="7" class="empty">No hay ventas registradas</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
